# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Liusan's Blog
subtitle: 海底修羅場｜日々進化中
description: 試圖留下什麼的部落格，記錄學習與生活體驗。
keywords: 前端, 技術筆記, 日本生活, 東京工作, 程式學習, Heidi Liu, Liusan
author: Heidi Liu
language:
  - zh-TW
  - en
  - ja
timezone: Asia/Taipei

# URL
url: https://heidiliu2020.github.io
root: /
permalink: :title/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render: google*.html

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: next

# Deployment
deploy:
  type: git
  repo: https://github.com/heidiliu2020/heidiliu2020.github.io.git
  branch: gh-pages

# Search
search:
  path: search.xml
  field: post
  content: true

# Sitemap
sitemap:
  path: sitemap.xml

baidusitemap:
  path: baidusitemap.xml

# RSS Feed
feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content: true

# hexo-neat: minify generated HTML/CSS (JS left untouched to stay safe)
neat_enable: true
neat_html:
  enable: true
  exclude:
neat_css:
  enable: true
  exclude:
    - '**/*.min.css'
neat_js:
  enable: false

# Symbols count time
symbols_count_time:
  symbols: true
  time: true
  total_symbols: false
  total_time: false
  exclude_codeblock: false
